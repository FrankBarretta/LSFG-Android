name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # โปรเจกต์ไม่มี gradlew -> ระบุ Gradle เอง (AGP 8.7.3 ต้อง Gradle >= 8.9)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # ติดตั้ง cmdline-tools + ตั้ง ANDROID_HOME / PATH ให้ sdkmanager ใช้ได้
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK, NDK, CMake
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
                     "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: framegen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
